<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <title>РЕМОНТ ТЕХНИКИ</title>
  </head>
  <body>
    <h2>РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ</h2>
    <div class="brands mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="images/cat1.svg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="images/cat1 copy.svg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="images/cat1 copy 2.svg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="images/cat1 copy 3.svg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="images/cat1 copy 7.svg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="images/cat1 copy 8.svg" alt="" />
        </div>
        <div class="swiper-slide midle ">
          <img src="images/cat1 copy 9.svg" alt="" />
        </div>
        <div class="swiper-slide midle">
          <img src="images/cat1 copy 10.svg" alt="" />
        </div>
        <div class="swiper-slide midle large">
          <img src="images/cat1.svg" alt="" />
        </div>
        <div class="swiper-slide midle large">
          <img src="images/cat1 copy.svg" alt="" />
        </div>
        <div class="swiper-slide midle large">
          <img src="images/cat1 copy 2.svg" alt="" />
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
    <div class="hide">
      <img src="images/expand.svg" alt="" />
      <p>Показать все</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
